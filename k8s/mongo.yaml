apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
# EKS Auto Mode's node CSINode only registers the "ebs.csi.eks.amazonaws.com" driver
# (confirmed via `kubectl get csinode -o yaml`) — the legacy in-tree "gp2" StorageClass
# (provisioner kubernetes.io/aws-ebs) has no driver on Auto Mode nodes and can't bind.
# Auto Mode does not create a StorageClass for its own driver automatically, so this
# one must exist before any PVC can use EBS-backed storage.
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: namegen
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: namegen
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Running as non-root from the start makes the official image's entrypoint skip its
        # root-only chown + gosu step. fsGroup gives this uid write access to the EBS volume.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          # 3.6 went end-of-life in 2021. 8.0 is the current major release line, and its image had
          # the fewest Trivy findings of the 8.x tags. A fresh volume is assumed: mongod can't open a
          # 3.6 data directory directly, it has to step through every major version in between.
          image: mongo:8.0
          ports:
            - containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              # mongod sizes its WiredTiger cache from this cgroup limit (max(256 MB, 50% of (limit - 1 GB))).
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            # mongod creates its unix socket in /tmp, which readOnlyRootFilesystem would otherwise block.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-sc
        resources:
          requests:
            storage: 1Gi

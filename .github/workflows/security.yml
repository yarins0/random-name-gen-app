name: Security

on:
  # Every branch, like test.yml, so a PR shows results for its head commit.
  push:
  # Weekly re-scan: new CVEs get published against code that hasn't changed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA. In March 2026, attackers force-pushed
# most of aquasecurity/trivy-action's version tags to malicious commits that stole CI secrets;
# a SHA can't be re-pointed the way a tag can. The trailing comment records the version.
env:
  TRIVY_VERSION: v0.74.0

jobs:
  # Repo-level scan: IaC misconfigurations (Terraform, K8s manifests, Dockerfile) and secrets.
  # Accepted findings live in .trivyignore.yaml, which trivy.yaml loads automatically.
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: misconfig,secret
          format: sarif
          output: trivy-config.sarif

      - name: Upload to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  # The image deploy.yml ships: OS packages from the base image plus the app's npm dependencies.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (not pushed)
        run: docker build -t namegen:${{ github.sha }} .

      - name: Scan image (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: namegen:${{ github.sha }}
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif

      - name: Upload to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # --ignore-unfixed: gate only on CVEs that have a fix to upgrade to.
      - name: Fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: namegen:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Report-only: the official mongo image carries CVEs (Go stdlib in gosu and the bundled tools,
  # openssl, mongosh's js-yaml) that only an upstream rebuild can fix, so it can't gate a build
  # this repo has no way to turn green. Findings still land in the Security tab to track.
  mongo-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read the tag from the manifest so this always scans what's actually deployed.
      - name: Resolve mongo image from k8s/mongo.yaml
        id: mongo
        run: echo "image=$(grep -oE 'image:[[:space:]]*mongo:[^[:space:]]+' k8s/mongo.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Scan mongo image (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.mongo.outputs.image }}
          scanners: vuln
          format: sarif
          output: trivy-mongo.sarif

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-mongo.sarif
          category: trivy-mongo-image

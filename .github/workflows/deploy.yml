name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: 592404497449.dkr.ecr.eu-north-1.amazonaws.com/namegen
  EKS_CLUSTER_NAME: namegen

jobs:
  # Build and scan in a job with no cloud access (no id-token permission, no AWS credentials),
  # so the scanner and the build never run where deploy secrets exist. The scanned image is
  # handed to the deploy job as a tarball: what ships is byte-for-byte what was scanned.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t $ECR_REPOSITORY:$GITHUB_SHA .

      # The deploy gate: fixable HIGH/CRITICAL vulnerabilities or leaked secrets stop the release.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Export image
        run: docker save $ECR_REPOSITORY:$GITHUB_SHA -o image.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      - name: Load scanned image
        run: docker load -i image.tar

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::592404497449:role/namegen-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Only the commit-SHA tag: the ECR repo is IMMUTABLE, so a moving :latest can't be re-pushed.
      - name: Push image
        run: docker push $ECR_REPOSITORY:$GITHUB_SHA

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      # Applies the whole manifest (not just `kubectl set image`) so changes to k8s/app.yaml,
      # such as its securityContext, ship with the image. The new SHA tag changes the pod spec,
      # which triggers a real rollout.
      - name: Roll out new image
        run: |
          sed "s|:IMAGE_TAG|:$GITHUB_SHA|" k8s/app.yaml | kubectl apply -f -
          kubectl rollout status deployment/namegen --namespace namegen
